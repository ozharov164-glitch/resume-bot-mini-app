<!-- Simulated MainButton fixed to bottom for WebApp context (optional visual representation if needed, though buttons above act as primary actions in this layout) -->
<!-- In a real Telegram Mini App, WebApp.MainButton would be used natively. 
         We leave it out of the HTML flow to adhere to "Strictly utilizes the native Telegram WebApp.MainButton" guideline,
         but provide prominent on-screen buttons as requested. -->
<script>
        // Micro-interactions and haptic feedback simulation
        function simulateHaptic() {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
            } else {
                console.log('Haptic feedback simulated (medium)');
            }
        }

        function handleStarsPayment() {
            simulateHaptic();
            // Note for Dev: Stars button opens WebApp.openInvoice
            console.log('Action: openInvoice for Telegram Stars');
            
            // Visual feedback
            const btn = document.querySelector('.bg-primary-container');
            const originalContent = btn.innerHTML;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin">refresh</span><span class="font-label-lg text-label-lg font-bold">Обработка...</span>`;
            
            setTimeout(() => {
                btn.innerHTML = originalContent;
            }, 1500);
        }

        function handleCardPayment() {
            simulateHaptic();
            console.log('Action: Initialize card payment flow');
        }
    </script>
