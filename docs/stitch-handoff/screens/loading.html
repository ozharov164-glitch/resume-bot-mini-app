<!DOCTYPE html>

<html lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Создаем резюме...</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error": "#ba1a1a",
                        "outline": "#6c7a71",
                        "tertiary-fixed": "#ffdad7",
                        "on-tertiary-fixed-variant": "#842225",
                        "on-surface-variant": "#3c4a42",
                        "inverse-primary": "#4edea3",
                        "surface-container-high": "#e3eae3",
                        "surface-dim": "#d4dcd5",
                        "tg-bg-light": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-surface": "#161d19",
                        "surface-container-low": "#eef6ee",
                        "secondary-fixed": "#d9e3f1",
                        "on-secondary-fixed": "#121c26",
                        "on-primary-container": "#00422b",
                        "secondary-container": "#d6e1ef",
                        "error-container": "#ffdad6",
                        "on-secondary": "#ffffff",
                        "primary-fixed": "#6ffbbe",
                        "primary-fixed-dim": "#4edea3",
                        "tertiary-container": "#fc7c78",
                        "tertiary": "#a43a3a",
                        "text-muted-dark": "#aaaaaa",
                        "tg-secondary-bg-dark": "#242f3d",
                        "primary-container": "#10b981",
                        "surface-container-lowest": "#ffffff",
                        "surface-tint": "#006c49",
                        "secondary-fixed-dim": "#bdc7d5",
                        "background": "#f4fbf4",
                        "surface-variant": "#dde4dd",
                        "text-muted-light": "#707579",
                        "on-error": "#ffffff",
                        "on-primary-fixed": "#002113",
                        "on-secondary-fixed-variant": "#3e4853",
                        "on-error-container": "#93000a",
                        "surface": "#f4fbf4",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed-dim": "#ffb3af",
                        "on-tertiary-fixed": "#410005",
                        "primary": "#006c49",
                        "outline-variant": "#bbcabf",
                        "surface-bright": "#f4fbf4",
                        "inverse-surface": "#2b322d",
                        "tg-bg-dark": "#17212b",
                        "inverse-on-surface": "#ebf3eb",
                        "surface-container-highest": "#dde4dd",
                        "on-primary-fixed-variant": "#005236",
                        "surface-container": "#e8f0e9",
                        "on-background": "#161d19",
                        "brand-muted": "rgba(16, 185, 129, 0.1)",
                        "secondary": "#555f6b",
                        "on-tertiary-container": "#711419",
                        "on-secondary-container": "#59646f",
                        "tg-secondary-bg-light": "#f4f4f5"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "comfortable": "16px",
                        "base": "8px",
                        "container-padding": "16px",
                        "tight": "4px",
                        "stack": "24px"
                    },
                    "fontFamily": {
                        "heading": ["Nunito Sans", "sans-serif"],
                        "label-sm": ["Nunito Sans", "sans-serif"],
                        "label-lg": ["Nunito Sans", "sans-serif"],
                        "display": ["Nunito Sans", "sans-serif"],
                        "body": ["Nunito Sans", "sans-serif"]
                    },
                    "fontSize": {
                        "heading": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "display": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "body": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    },
                    animation: {
                        'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'scan': 'scan 2s linear infinite',
                    },
                    keyframes: {
                        scan: {
                            '0%': { transform: 'translateY(-100%)' },
                            '100%': { transform: 'translateY(100%)' },
                        }
                    }
                }
            }
        }

<style>
        body {
            background-color: theme('colors.surface');
            color: theme('colors.on-surface');
            font-family: 'Nunito Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased min-h-screen flex flex-col items-center">
<!-- TopAppBar Semantic Shell -->
<header class="docked full-width top-0 bg-surface dark:bg-tg-bg-dark flex items-center justify-between px-container-padding h-14 w-full z-50">
<div class="flex items-center">
<span aria-label="Back" class="material-symbols-outlined text-primary dark:text-primary-fixed mr-4 hover:opacity-80 transition-opacity cursor-pointer active:scale-95 transition-transform duration-150">arrow_back</span>
<h1 class="font-heading text-heading font-bold text-on-surface dark:text-on-surface-variant tracking-tight">РезюмеБот</h1>
</div>
<span aria-label="Close" class="material-symbols-outlined text-on-surface-variant dark:text-text-muted-dark hover:opacity-80 transition-opacity cursor-pointer active:scale-95 transition-transform duration-150">close</span>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-md mx-auto flex flex-col justify-center items-center px-container-padding py-stack">
<!-- Animated Illustration Area -->
<div class="relative w-48 h-48 mb-8 flex items-center justify-center">
<!-- Background Glow -->
<div class="absolute inset-0 bg-brand-muted rounded-full animate-pulse-fast"></div>
<!-- Document Icon Base -->
<div class="relative z-10 w-24 h-32 bg-surface-container-lowest rounded-xl shadow-lg border border-outline-variant flex flex-col p-4 overflow-hidden">
<div class="w-full h-2 bg-surface-variant rounded mb-2"></div>
<div class="w-3/4 h-2 bg-surface-variant rounded mb-2"></div>
<div class="w-5/6 h-2 bg-surface-variant rounded mb-2"></div>
<div class="w-full h-2 bg-surface-variant rounded mb-4"></div>
<div class="w-1/2 h-2 bg-primary-container/30 rounded mt-auto"></div>
<!-- Scanner Line -->
<div class="absolute inset-x-0 h-1 bg-primary shadow-[0_0_8px_theme('colors.primary')] animate-scan opacity-80"></div>
</div>
<!-- Floating Elements -->
<span class="material-symbols-outlined absolute top-4 right-4 text-primary opacity-60 animate-bounce" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined absolute bottom-8 left-2 text-inverse-primary opacity-60 animate-pulse">check_circle</span>
</div>
<!-- Typography -->
<h2 class="font-display text-display text-on-surface text-center mb-2">Создаем твое идеальное резюме...</h2>
<p class="font-body text-body text-on-surface-variant text-center mb-stack">Структурируем навыки и опыт...</p>
<!-- Progress Indicator -->
<div class="w-full max-w-xs mt-4">
<div class="h-2 w-full bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full w-4/5 transition-all duration-1000 ease-out relative">
<!-- Shimmer effect on progress bar -->
<div class="absolute top-0 left-0 bottom-0 w-full bg-gradient-to-r from-transparent via-white/30 to-transparent -translate-x-full animate-[shimmer_2s_infinite]"></div>
</div>
</div>
<div class="flex justify-between mt-2">
<span class="font-label-sm text-label-sm text-on-surface-variant">Анализ данных</span>
<span class="font-label-sm text-label-sm text-primary font-bold">80%</span>
</div>
</div>
</main>
<style>
        @keyframes shimmer {
            100% {
                transform: translateX(100%);
            }
        }
    </style>
<script>
        // Simulate haptic feedback for loading stages if in Telegram environment
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            // Periodic light haptic to simulate work being done
            setInterval(() => {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
            }, 1500);
        }
    </script>
</body></html>
