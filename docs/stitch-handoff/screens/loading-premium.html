<style>
        body { background-color: #ffffff; min-height: max(884px, 100dvh); }
        
        /* Document Animation */
        @keyframes float-breathe {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        @keyframes parallax-drift {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(-2px); }
        }
        
        .anim-float {
            animation: float-breathe 4s ease-in-out infinite;
        }
        .anim-drift {
            animation: parallax-drift 4s ease-in-out infinite;
        }

        /* Writing Simulation & Staggers */
        .stagger-item {
            opacity: 0;
            transform: translateY(10px);
            animation: fade-in-up 0.5s ease-out forwards;
        }
        @keyframes fade-in-up {
            to { opacity: 1; transform: translateY(0); }
        }
        
        .delay-1 { animation-delay: 450ms; }
        .delay-2 { animation-delay: 900ms; }
        .delay-3 { animation-delay: 1350ms; }
        .delay-4 { animation-delay: 1800ms; }

        @keyframes fill-pill {
            0% { background: #ECECEC; }
            100% { background: rgba(16, 185, 129, 0.15); }
        }
        .pill-fill {
            background: #ECECEC;
            animation: fill-pill 0.8s ease-out forwards;
        }
        .pill-delay-1 { animation-delay: 2200ms; }
        .pill-delay-2 { animation-delay: 2500ms; }
        .pill-delay-3 { animation-delay: 2800ms; }

        @keyframes grow-cursor {
            0% { height: 0%; opacity: 0.5; }
            50% { height: 100%; opacity: 1; box-shadow: 0 0 12px #10B981; }
            100% { height: 0%; opacity: 0.5; }
        }
        .cursor-grow {
            animation: grow-cursor 2.5s ease-in-out infinite;
        }

        /* Progress Bar */
        @keyframes progress-fill {
            from { width: 0%; }
            to { width: 85%; }
        }
        .anim-progress {
            animation: progress-fill 12s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        
        @keyframes pulse-edge {
            0%, 100% { opacity: 0.5; transform: scaleX(1); }
            50% { opacity: 1; transform: scaleX(1.5); }
        }
        .progress-pulse {
            animation: pulse-edge 1.5s ease-in-out infinite;
        }

        /* Text Crossfade */
        .status-text {
            transition: opacity 200ms ease-in-out;
        }

        /* Prefers Reduced Motion */
        @media (prefers-reduced-motion: reduce) {
            *, ::before, ::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
            .anim-float, .anim-drift, .cursor-grow, .progress-pulse {
                animation: none !important;
            }
            .stagger-item { opacity: 1; transform: none; }
            .anim-progress { width: 85%; }
            .pill-fill { background: rgba(16, 185, 129, 0.15); }
        }
    </style>
</head>
<body class="font-body-base text-on-surface selection:bg-primary-container selection:text-on-primary-container antialiased flex flex-col min-h-screen" style="background-color: #FFFFFF;">
<!-- TopAppBar -->
<header class="bg-surface-container-lowest fixed top-0 w-full h-[56px] z-50 border-b border-outline-variant/10">
<div class="flex justify-between items-center px-4 max-w-[480px] mx-auto w-full h-full">
<button class="text-primary hover:opacity-80 transition-opacity active:scale-95 duration-200 flex items-center justify-center p-2 rounded-full hover:bg-surface-container-low">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-header-title text-header-title text-on-surface" style="font-size: 17px; font-weight: 600;">РезюмеБот</h1>
<button class="text-primary hover:opacity-80 transition-opacity active:scale-95 duration-200 flex items-center justify-center p-2 rounded-full hover:bg-surface-container-low">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-[56px] w-full max-w-[480px] mx-auto flex flex-col items-center pt-8 pb-8 px-6">
<!-- Hero: Document Animation -->
<div class="relative w-[200px] h-[282px] mb-10 flex justify-center items-center anim-float">
<!-- Back Sheet -->
<div class="absolute w-full h-full bg-white rounded-[16px] border border-black/5 top-[5px] left-[5px] opacity-30 shadow-sm anim-drift"></div>
<!-- Front Sheet -->
<div class="relative w-full h-full bg-white rounded-[16px] border border-black/5 shadow-[0_10px_30px_rgba(0,0,0,0.04),0_20px_60px_rgba(0,108,73,0.08)] p-5 flex flex-col overflow-hidden z-10">
<!-- Header: Name & Title -->
<div class="flex gap-3 mb-4 stagger-item delay-1">
<div class="w-10 h-10 bg-surface-container-highest rounded-full flex-shrink-0"></div>
<div class="flex-1 flex flex-col gap-1.5 pt-1">
<div class="h-2.5 w-[85%] bg-[#161D19] rounded-[2px]"></div>
<div class="h-2 w-[55%] bg-[#707579] rounded-[2px] stagger-item delay-2"></div>
</div>
</div>
<!-- Content -->
<div class="flex flex-col gap-4">
<!-- Experience Segment -->
<div class="flex flex-col gap-2 p-2 -mx-2 rounded-md bg-[#ECFDF5] stagger-item delay-3">
<div class="text-[10px] font-bold tracking-[0.1em] text-primary uppercase">ОПЫТ</div>
<div class="h-1.5 w-full bg-outline-variant/40 rounded-sm"></div>
<div class="h-1.5 w-[90%] bg-outline-variant/40 rounded-sm"></div>
</div>
<!-- Active Writing Segment -->
<div class="flex flex-col gap-2 relative stagger-item delay-4">
<div class="text-[10px] font-bold tracking-[0.1em] text-primary uppercase opacity-60">НАВЫКИ</div>
<div class="flex flex-wrap gap-2">
<div class="h-5 w-12 rounded-[10px] opacity-80 pill-fill pill-delay-1"></div>
<div class="h-5 w-16 rounded-[10px] opacity-60 pill-fill pill-delay-2"></div>
<div class="h-5 w-10 rounded-[10px] opacity-40 pill-fill pill-delay-3"></div>
</div>
<!-- Vertical Emerald Cursor -->
<div class="absolute right-[-8px] top-0 w-[2px] bg-[#10B981] shadow-[0_0_8px_#10B981] cursor-grow"></div>
</div>
</div>
</div>
</div>
<!-- Typography & Progress -->
<div class="w-full max-w-[320px] text-center flex flex-col gap-4">
<div>
<h2 class="font-display text-display text-on-surface mb-2 tracking-tight status-text" id="status-heading">Адаптирую под алгоритмы hh.ru...</h2>
<p class="font-body-base text-body-base text-on-surface-variant">Создаём идеальную структуру для работодателя</p>
</div>
<!-- Progress Bar -->
<div class="w-full bg-[#F4F4F5] rounded-full h-[3px] mt-6 overflow-hidden relative">
<div class="bg-[#10B981] h-full rounded-full w-0 anim-progress relative">
<div class="absolute right-0 top-0 h-full w-4 bg-white/60 blur-[2px] progress-pulse"></div>
</div>
</div>
<div class="text-right w-full">
<span class="font-label-caps text-label-caps text-[#10B981]" id="progress-text">0%</span>
</div>
</div>
</main>
<script>
    // Text Rotation
    const phrases = [
        "Анализирую ваш опыт...", 
        "Подбираю правильные формулировки...", 
        "Адаптирую под алгоритмы hh.ru...", 
        "Почти готово..."
    ];
    let currentPhrase = 0;
    const heading = document.getElementById('status-heading');
    
    setInterval(() => {
        heading.style.opacity = '0';
        setTimeout(() => {
            currentPhrase = (currentPhrase + 1) % phrases.length;
            heading.textContent = phrases[currentPhrase];
            heading.style.opacity = '1';
        }, 200);
    }, 3000);

    // Progress percentage update (syncs roughly with 12s CSS animation to 85%)
    const progressText = document.getElementById('progress-text');
    let progress = 0;
    const duration = 12000;
    const target = 85;
    const interval = 100;
    const steps = duration / interval;
    const increment = target / steps;

    const progressTimer = setInterval(() => {
        progress += increment;
        if (progress >= target) {
            progress = target;
            clearInterval(progressTimer);
        }
        progressText.textContent = Math.round(progress) + '%';
    }, interval);
</script>
</body></html>
