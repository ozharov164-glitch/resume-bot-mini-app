<button class="p-2 -mr-2 text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-150 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>

<!-- Animated Icon Container -->

<span class="material-symbols-outlined text-[64px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>

<h2 class="font-display text-display text-on-surface m-0">Ура! Твое резюме готово</h2>
<p class="font-body text-body text-text-muted-light m-0 px-4">

            </p>
</div>
</main>
<!-- Bottom Fixed CTA Area (Mimicking Telegram MainButton) -->
<div class="shrink-0 p-container-padding bg-surface pt-4 pb-safe-bottom w-full max-w-md mx-auto z-50 relative">
<button class="w-full bg-primary-container text-on-primary font-label-lg text-label-lg h-[48px] rounded-lg flex items-center justify-center active:scale-[0.98] transition-transform shadow-[0_2px_8px_rgba(16,185,129,0.25)] hover:bg-[#0e9d6d]">
            Вернуться в бот
        </button>
</div>
<script>
        // Optional: Trigger a lightweight haptic feedback simulation if in a browser environment
        // In a real TG Mini App, this would be window.Telegram.WebApp.HapticFeedback.impactOccurred('medium')
        document.addEventListener("DOMContentLoaded", () => {
            if (navigator.vibrate) {
                // Subtle double-pulse to signify success
                navigator.vibrate([30, 50, 30]);
            }
        });
    </script>
