# Один workflow на push в main — в Actions не дублируются два отдельных прогона.
name: CI and Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_API_URL: https://62-217-182-239.nip.io

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - "frontend/**"
              - ".github/workflows/ci-and-deploy.yml"

  backend-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python3 -m compileall -q backend bot scripts
      - name: Install test dependencies
        run: pip install -q -r backend/requirements.txt pytest pytest-asyncio
      - name: Unit tests
        env:
          DEBUG: "true"
          BOT_TOKEN: "0:test"
          OPENROUTER_API_KEY: test
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_KEY: test
          JWT_SECRET: test-jwt-secret-at-least-32-characters-long
          APP_URL: https://example.test
          FRONTEND_URL: https://example.test/app
          BOT_USERNAME: resumeez_bot
        run: PYTHONPATH=backend pytest -q backend/tests

  build:
    runs-on: ubuntu-latest
    needs: [changes, backend-bot]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}
      - name: Cache headers for static assets
        run: |
          cat > dist/_headers <<'EOF'
          /assets/*
            Cache-Control: public, max-age=31536000, immutable
          /sw.js
            Cache-Control: public, max-age=0, must-revalidate
          /*
            Cache-Control: public, max-age=0, must-revalidate
          EOF
        working-directory: frontend
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
