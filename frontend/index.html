    <link rel="preconnect" href="https://telegram.org" crossorigin />
    <link rel="preconnect" href="https://62-217-182-239.nip.io" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #ffffff;
        color: #161d19;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #root {
        min-height: 100svh;
        min-height: var(--tg-viewport-stable-height, 100svh);
      }
      .boot-splash {
        display: flex;
        min-height: 100svh;
        min-height: var(--tg-viewport-stable-height, 100svh);
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 0.75rem;
        padding: 1.5rem;
      }
      .boot-spinner {
        width: 2.5rem;
        height: 2.5rem;
        border: 2px solid #10b981;
        border-top-color: transparent;
        border-radius: 9999px;
        animation: boot-spin 0.75s linear infinite;
      }
      .boot-label {
        margin: 0;
        font-size: 0.9375rem;
        font-weight: 600;
        color: #707579;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .material-symbols-outlined {
        font-family: "Material Symbols Outlined";
        font-weight: normal;
        font-style: normal;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        font-feature-settings: "liga";
        -webkit-font-smoothing: antialiased;
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      }
      .material-symbols-outlined.filled {
        font-variation-settings: "FILL" 1, "wght" 400, "GRAD" 0, "opsz" 24;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" aria-live="polite">
        <div class="boot-spinner" aria-hidden="true"></div>
        <p class="boot-label">Загружаем приложение…</p>
      </div>
    </div>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function () {
        try {
          var w = window.Telegram && window.Telegram.WebApp;
          if (!w) return;
          w.ready();
          w.expand();
          if (w.disableVerticalSwipes) w.disableVerticalSwipes();
          var h = w.viewportStableHeight || window.innerHeight;
          document.documentElement.style.setProperty("--tg-viewport-stable-height", h + "px");
        } catch (e) {}
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,500;0,6..12,600;0,6..12,700;0,6..12,800;1,6..12,400;1,6..12,700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>

        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,500;0,6..12,600;0,6..12,700;0,6..12,800;1,6..12,400;1,6..12,700&display=swap"
      />
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
